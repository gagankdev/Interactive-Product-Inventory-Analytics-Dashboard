<!DOCTYPE html>
<html>
<head>
  <title>Bill Calculator</title>
</head>
<body>
  <h2>Bill Calculator</h2>
  <p>Open Console tab for Result</p>

  <script>
    const bill = Number(prompt("Enter bill amount:"));
    const tipPercent = Number(prompt("Enter tip percentage:"));

    if (
      !Number.isFinite(bill) ||
      !Number.isFinite(tipPercent) ||
      bill < 0 ||
      tipPercent < 0
    ) {
      console.log("Please enter valid non-negative numbers.");
    } else {
      const tip = bill * tipPercent / 100;
      const total = bill + tip;

      console.log(`Subtotal: $${bill}`);
      console.log(`Tip Percentage: ${tipPercent}%`);
      console.log(`Calculated Tip: $${tip}`);
      console.log(`Total Amount to Pay: $${total}`);
    }
  </script>
</body>
</html>
